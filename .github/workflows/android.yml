name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build_output.log
          EXIT=$?
          echo "===== KOTLIN COMPILE ERRORS (e:) ====="
          grep -n "^e:" build_output.log || echo "(no e: lines found above)"
          echo "======================================"
          exit $EXIT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusMoment-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 专注时刻 v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
